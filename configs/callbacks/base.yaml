checkpoint:
  enabled: true
  monitor: val/psnr
  mode: max
  dirpath: ${output_dir}/checkpoints
  filename: epoch-{epoch:03d}
  save_top_k: 1
  save_last: true
  every_n_epochs: 1
  save_weights_only: false
  auto_insert_metric_name: false

visualization:
  enabled: true
  num_samples: 4
  output_dir: ${output_dir}/visual_qa
  every_n_epochs: 1
  filename_prefix: sr
  save_test: true

lr_monitor:
  enabled: true
  logging_interval: epoch
