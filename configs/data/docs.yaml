defaults:
- base
- _self_
name: docs
image_mode: rgb
degradation:
  blur:
    enabled: false
    probability: 0.0
  resize:
    enabled: true
    probability: 1.0
    interpolation: bicubic
    antialias: true
  noise:
    enabled: false
    probability: 0.0
    type: gaussian
    sigma_range:
    - 0.0
    - 0.0
  jpeg:
    enabled: false
    probability: 0.5
    quality_range:
    - 50
    - 95
    block_size: 8
    blockiness: 0.0
  bleedthrough:
    enabled: true
    probability: 0.3
    opacity_range:
    - 0.12
    - 0.24
    sigma_range:
    - 3.0
    - 6.0
    kernel_size: 17
    mirror_axis: random
  motor_blur:
    enabled: true
    probability: 0.15
    axis: random
    kernel_size_range:
    - 3
    - 7
    strength_range:
    - 0.1
    - 0.3
  contact_blur:
    enabled: true
    probability: 0.4
    kernel_size: 7
    sigma_range:
    - 0.2
    - 1.2
    strength_range:
    - 0.03
    - 0.1
    local_probability: 0.7
    mask_grid_size: 12
    mask_threshold: 0.65
  impulse_noise:
    enabled: true
    probability: 0.15
    density_range:
    - 0.0001
    - 0.0003
    dark_probability: 0.8
  poisson_noise:
    enabled: true
    probability: 0.08
    peak_range:
    - 800.0
    - 3000.0
