defaults:
  - base
  - _self_
name: mri
image_mode: grayscale
extensions: [.dcm]

degradation:
  noise:
    type: rician
    sigma_range: [0.001, 0.025]
  jpeg:
    enabled: false
    probability: 0.0
  resize:
    interpolation: kspace
  inhomogeneity:
    enabled: true
    probability: 0.5
    strength_range: [0.05, 0.2]
  ghosting:
    enabled: true
    probability: 0.3
    intensity_range: [0.02, 0.08]
  blur:
    enabled: false
