[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "domain-adaptive-image-sr"
version = "0.1.0"
requires-python = ">=3.11, <3.13"
dependencies = [
    "albumentations",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "lightning",
    "torchmetrics",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "numpy",
    "kornia",
    "opencv-python-headless",
    "rich",
    "tqdm",
    "pillow",
    "pydicom"
]
readme = "README.md"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "black"
]

[tool.ruff]
line-length = 88
lint.select = ["E", "F", "I", "B"]

[tool.hatch.build.targets.wheel]
packages = ["src/domain_adaptive_image_sr"]
